name: E2E Tests

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests-e2e/pyproject.toml

      - name: Fix Maven wrapper permissions
        run: chmod +x api/mvnw secret-webapp/mvnw

      - name: Install Python test dependencies
        run: pip install ./tests-e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests-e2e/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: ./keycloak
          tags: keycloak:latest
          load: true
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Pull static Docker images
        run: docker compose pull postgres openldap phpldapadmin smtp oauth2-proxy

      - name: Pre-warm Maven dependency cache
        run: |
          cd api && ./mvnw -B -q dependency:go-offline
          cd secret-webapp && ./mvnw -B -q dependency:go-offline

      - name: Cache vue-app node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: vue-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('vue-app/package-lock.json') }}

      - name: Install vue-app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: vue-app

      - name: Run e2e tests
        working-directory: tests-e2e
        run: pytest -v --timeout=300
        env:
          PYTHONUNBUFFERED: "1"

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs --tail=1000 || true

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: tests-e2e/artifacts/
          retention-days: 7
