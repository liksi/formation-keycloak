services:

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pwd
      POSTGRES_USER: user
      POSTGRES_DB: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: keycloak:${TAG:-latest}
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "8080:8080"
      - "9000:9000"
      - "9990:9990"
    environment:
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: pwd
      KC_DB_USERNAME: user
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: none
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  oauth2-proxy:
    container_name: oauth2-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_PROVIDER: "keycloak-oidc"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Keycloak"
      OAUTH2_PROXY_COOKIE_SECRET: "0123456789abcdef0123456789abcdef"
      OAUTH2_PROXY_SCOPE: "openid"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_CLIENT_ID: "oauth2-proxy"
      OAUTH2_PROXY_CLIENT_SECRET: "PVIrotLG3RhMifMKu9MCaHmpMj81x5JD"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Point to master realm for startup — override with your realm in PW6
      OAUTH2_PROXY_OIDC_ISSUER_URL: "http://localhost:8080/realms/master"
      OAUTH2_PROXY_REDIRECT_URL: "http://localhost:4180/oauth2/callback"
      OAUTH2_PROXY_UPSTREAMS: "http://localhost:8090"

      # Authorization configuration (uncomment for PW6 §4)
      #OAUTH2_PROXY_ALLOWED_ROLES: "MANAGER"
    network_mode: host

  openldap:
    container_name: openldap
    image: osixia/openldap:1.5.0
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ORGANISATION: test
      LDAP_DOMAIN: formation

  phpldapadmin:
    container_name: ldap-admin
    image: osixia/phpldapadmin
    ports:
      - "6443:443"
    environment:
      PHPLDAPADMIN_HTTPS: "true"
      PHPLDAPADMIN_LDAP_HOSTS: openldap

  smtp:
    image: maildev/maildev:2.1.0
    container_name: smtp
    ports:
      - "1080:1080"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:1080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: ./api
    container_name: api
    network_mode: host
    depends_on:
      keycloak:
        condition: service_healthy

  secret-webapp:
    build: ./secret-webapp
    container_name: secret-webapp
    network_mode: host
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      AUTHENTICATION_MODE: none
      # To switch to Keycloak OAuth2 mode, change to:
      #   AUTHENTICATION_MODE: keycloak
      #   SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/training

  vue-app:
    build: ./vue-app
    container_name: vue-app
    network_mode: host

volumes:
  postgres_data:
    driver: local
